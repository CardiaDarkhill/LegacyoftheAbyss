name: Publish Release

# Manual trigger only — nothing publishes from a normal push or tag.
# Usage: GitHub → Actions tab → "Publish Release" → Run workflow → enter version → Run.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.5.0) — passed to dotnet build as -p:Version'
        required: true
        type: string
      publish_nexus:
        description: 'Upload to Nexus Mods'
        required: true
        type: boolean
        default: true
      publish_thunderstore:
        description: 'Publish to Thunderstore'
        required: true
        type: boolean
        default: true

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # workflow_dispatch defaults to the DEFAULT branch, not whatever you were working on, and
      # nothing downstream notices: the version label comes from the inputs below, never from the
      # code, so a build of the wrong ref is packaged and published under the number you typed. That
      # shipped 1.1.0's code to both stores labelled 2.0.0. The changelog is the cheapest thing that
      # can only be true on the right ref.
      - name: Verify this ref is the release
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if (-not (Select-String -Path CHANGELOG.md -SimpleMatch "## $v" -Quiet)) {
            $heads = (Select-String -Path CHANGELOG.md -Pattern '^## ' | Select-Object -First 3 | ForEach-Object { $_.Line }) -join ', '
            throw "CHANGELOG.md on ref '$env:GITHUB_REF_NAME' has no '## $v' heading (it has: $heads). Either this is the wrong branch, or the changelog was not updated for $v. Pick the release branch in the Run workflow dropdown."
          }
          Write-Host "CHANGELOG.md on '$env:GITHUB_REF_NAME' documents $v."

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      # Build the plugin project explicitly rather than letting `dotnet build` pick up the .sln:
      # the solution also contains the xunit test project, which needs the game's Managed folder
      # to run and is pure overhead on a runner that will never run it.
      #
      # CreateDistributionPackages=true is required. Without it PrepareReleasePackages is skipped
      # (it is opt-in so that plain Release builds don't stage loadable duplicate DLLs inside the
      # live BepInEx/plugins tree) and every packaging step below silently has nothing to package.
      - name: Build Release packages
        run: dotnet build LegacyoftheAbyss.csproj -c Release -p:Version=${{ inputs.version }} -p:CreateDistributionPackages=true

      - name: Verify staged packages
        shell: pwsh
        run: |
          $nexus = "obj/Release/Nexus/LegacyoftheAbyss-${{ inputs.version }}/BepInEx/plugins/LegacyoftheAbyss.dll"
          $ts    = "obj/Release/Thunderstore/LegacyoftheAbyss/LegacyoftheAbyss.dll"
          if (-not (Test-Path $nexus)) { throw "Nexus staging is missing the plugin DLL: $nexus" }
          if (-not (Test-Path $ts))    { throw "Thunderstore staging is missing the plugin DLL: $ts" }
          Write-Host "Both staging folders contain the plugin DLL."

      # ---- Nexus Mods -----------------------------------------------------
      - name: Zip Nexus package
        if: ${{ inputs.publish_nexus }}
        shell: pwsh
        run: |
          $src = "obj/Release/Nexus/LegacyoftheAbyss-${{ inputs.version }}"
          $dest = "LegacyoftheAbyss-Nexus-${{ inputs.version }}.zip"
          if (-not (Test-Path $src)) { throw "Expected package folder not found: $src" }
          Compress-Archive -Path "$src/*" -DestinationPath $dest -Force
          echo "NEXUS_ZIP=$dest" >> $env:GITHUB_ENV

      # Input names below match Nexus-Mods/upload-action's action.yml: api_key, file_id, filename
      # and version are required; mod_id and display_name are optional. The action defines no
      # game_domain input — an earlier revision passed one, which Actions ignores with only a
      # warning, so it looked harmless while the real target came from file_id/mod_id all along.
      - name: Upload to Nexus Mods
        if: ${{ inputs.publish_nexus }}
        # Pinned to an exact tag: there is no stable v1 (or v1.x) ref on this action - every
        # release is v1.0.0-beta.N - so @v1 fails to resolve and the step never runs. Nexus's
        # Upload API is itself still an open beta, so re-check the tag list before bumping:
        # https://github.com/Nexus-Mods/upload-action/tags
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ vars.NEXUS_MOD_ID }}
          file_id: ${{ vars.NEXUS_FILE_ID }}
          filename: ${{ env.NEXUS_ZIP }}
          version: ${{ inputs.version }}
          display_name: LegacyoftheAbyss ${{ inputs.version }}
          # Defaults to false, which uploads the file as the new version while leaving the mod
          # page still displaying the old one - that drift is how a page ends up advertising a
          # version older than its own current download.
          update_mod_version: true

      # ---- Thunderstore -----------------------------------------------------
      - name: Install tcli
        if: ${{ inputs.publish_thunderstore }}
        run: dotnet tool install -g tcli

      # --package-version overrides thunderstore.toml's versionNumber, so no file rewriting is
      # needed and the committed toml is always valid as-is.
      - name: tcli build
        if: ${{ inputs.publish_thunderstore }}
        run: tcli build --package-version ${{ inputs.version }}

      # tcli reports success for a package whose copy source matched nothing, so check the zip
      # actually contains the plugin before uploading it — a bad version is permanent on
      # Thunderstore, it can only be superseded by another release.
      - name: Verify Thunderstore zip
        if: ${{ inputs.publish_thunderstore }}
        shell: pwsh
        run: |
          $zip = "build/CardiaDarkhill-LegacyoftheAbyss-${{ inputs.version }}.zip"
          if (-not (Test-Path $zip)) { throw "tcli did not produce $zip" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $names = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip)).Entries.FullName
          foreach ($required in @('LegacyoftheAbyss.dll','manifest.json','icon.png','README.md')) {
            if ($names -notcontains $required) { throw "Package is missing $required — contents: $($names -join ', ')" }
          }
          if (-not ($names | Where-Object { $_ -like 'plugins/Assets/*' })) { throw "Package contains no plugins/Assets entries." }
          Write-Host "Package verified: $($names.Count) entries."
          echo "TS_ZIP=$zip" >> $env:GITHUB_ENV

      # --file publishes the zip verified above instead of silently rebuilding a second,
      # unverified one.
      - name: tcli publish
        if: ${{ inputs.publish_thunderstore }}
        run: tcli publish --file ${{ env.TS_ZIP }}
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}

      - name: Upload build artifacts (backup / manual fallback)
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ inputs.version }}
          path: |
            obj/Release/Nexus/**
            obj/Release/Thunderstore/**
            build/*.zip
          retention-days: 30
